services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: kitlab_local_root
      MYSQL_DATABASE: kitlab
      MYSQL_USER: kitlab
      MYSQL_PASSWORD: kitlab_local
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mysql-data:
