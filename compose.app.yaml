services:
  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: mysql
      COMPOSER_ALLOW_SUPERUSER: "1"
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000
